name: Deploy NEON COP CHASE to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Rebuild standalone game page
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site
          cat chunks/payload-01.txt chunks/payload-02.txt chunks/payload-03.txt chunks/payload-04.txt chunks/payload-05.txt \
            | base64 --decode \
            | gzip --decompress \
            > _site/index.html
          test -s _site/index.html
          grep -q "NEON PURSUIT" _site/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: "_site"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
